<header class="top">
  <span class="badge">LIBRARY</span>
  <span id="app-name"></span>
  <label class="vh" for="search">Search every source</label>
  <input id="search" type="search" placeholder="Search  (cat:pad tag:warm colour:blue src:factory bank:u1 dup)" autocomplete="off">
  <div id="cats" role="group" aria-label="Categories"></div>
  <span class="spacer"></span>
  <button type="button" id="details-btn" aria-pressed="false" title="The patch in focus (I)">Patch details</button>
  <label class="info" for="theme">Theme</label>
  <select id="theme"></select>
</header>
<main>
  <section id="src-pane" class="pane" aria-label="Sources: what you have opened">
    <div class="bar">
      <span class="lab">Source</span>
      <div class="picker">
        <button type="button" id="src-prev" aria-label="The bank before">‹</button>
        <button type="button" id="src-pick" aria-haspopup="listbox" aria-expanded="false" aria-controls="src-menu"><span class="g"></span><span class="t"></span><span class="n"></span><span class="dd" aria-hidden="true">▾</span></button>
        <button type="button" id="src-next" aria-label="The bank after">›</button>
      </div>
      <button type="button" id="src-all" aria-pressed="false" title="Every bank you have opened, as one list (with the search)">All sources</button>
      <span id="src-pick-total" class="info"></span>
      <button type="button" id="open-files">+ Open files…</button>
      <button type="button" id="open-folder">+ Folder…</button>
      <button type="button" id="export" title="Your opened sources, tags and categories, as one zip">Export library</button>

      <span class="spacer"></span>
      <span id="src-sel" class="hint"></span>
      <span id="src-count" class="info"></span>
    </div>
    <div id="src-menu" hidden>
      <div class="mhead">
        <label class="vh" for="src-filter">Find a bank</label>
        <input id="src-filter" type="search" placeholder="Find a bank or collection" autocomplete="off" role="combobox" aria-controls="src-list" aria-expanded="true">
        <button type="button" id="src-closeall">Close all opened</button>
      </div>
      <div id="src-list" role="listbox" aria-label="Banks you have opened"></div>
    </div>
    <div id="src-grid" class="grid" role="grid" tabindex="0" aria-label="Source bank"></div>
  </section>
  <div id="split" role="separator" aria-orientation="horizontal" aria-label="Resize the two banks" tabindex="0"><span></span></div>
  <section id="dev-pane" class="pane" aria-label="The device's banks">

      <span class="lab" id="dev-label"></span>

      <span id="dev-info" class="info"></span>
      <span class="spacer"></span>

      <button type="button" id="undo" title="Ctrl+Z">Undo</button>
      <button type="button" id="restore" hidden title="The bank as it was before this session's first send">Restore</button>
      <button type="button" id="read">Read</button>
      <button type="button" id="download">Download</button>
      <button type="button" id="send" class="primary">Send</button>
    </div>
    <div id="dev-grid" class="grid" role="grid" tabindex="0" aria-label="Device bank"></div>
  </section>
</main>
<footer class="foot">
  <span id="status" role="status" aria-live="polite"></span>
  <span id="progress" hidden><span class="track"><span id="progress-bar"></span></span><span id="progress-text"></span></span>

    <label class="vh" for="d-name">Name</label>
    <input id="d-name" autocomplete="off">
    <span id="d-where"></span>
    <div class="bar"><button type="button" id="d-play" class="primary">▶ Audition</button></div>

    <span class="lab">Tags</span>

    <span class="lab">Amp env</span>
    <canvas id="d-env" class="pv" aria-hidden="true"></canvas>
    <span id="d-dups"></span>
  </div>
