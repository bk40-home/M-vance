# M-vance parameter overlay, keyed by JP-8080 patch byte offset (decimal).
# The JE-8086 table (docs/ref/parameterDescriptions_je.json) gives each byte's range, default and value names;
# this file adds what the engine and the panel need. tools/gen_params.py merges the two into firmware/gen/mv_params.h.
#
#   key     C name suffix (MV_P_<KEY>)          label   panel label, <= 7 characters (240 px / 4 knobs)
#   sec     JP panel section                    status  HAVE / ADAPT / NEW / STORE (kept, not used) / DROP
#   law     byte -> engine law (Stage 5)        jt      the JT component it is ported from
#
# Morph bytes 74..238 are generated from the JE names (sec CTRL / VELO); only the switches are listed here.
params:
  16:  {key: LFO1_WAVE,    label: WAVE,    sec: LFO1,  status: HAVE,  law: enum,          jt: Lfo}
  17:  {key: LFO1_RATE,    label: RATE,    sec: LFO1,  status: HAVE,  law: jp_lfo1_rate,  jt: JpLfoRate}
  18:  {key: LFO1_FADE,    label: FADE,    sec: LFO1,  status: HAVE,  law: jp_env_tau,    jt: JpEnvLaw (attack on depth)}
