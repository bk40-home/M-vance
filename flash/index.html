<html lang="en" data-theme="amber">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="fm1-count" content="__COUNT__">
<title>M-vance firmware</title>
<!-- Install M-vance on an FM-1 from the browser (Chrome or Edge, Web MIDI). fm1-kit's flash.js and fm1ota.js (the
     same update as tools/fm1_install.py). flash/build.sh copies this and the kit's files to docs/flash/; the Pages
     workflow puts the latest release's packages in docs/flash/firmware/ with latest.json (tools/flash_manifest.py)
     and fills __COUNT__ (the GoatCounter address, the repo variable GOATCOUNTER_URL; empty: nothing counted). -->
<link rel="stylesheet" href="theme.css?v=__BUILD__">
<link rel="stylesheet" href="flash.css?v=__BUILD__">
<script src="theme.js?v=__BUILD__"></script>
<script src="count.js?v=__BUILD__"></script>

<header class="kit-top">
  <span class="badge">FIRMWARE</span>
  <span class="name">M-vance</span>
  <span class="spacer"></span>
  <a class="btn" href="../">Home</a>
  <a class="btn" href="../sim/">Simulator</a>
  <a class="btn" href="../library.html">Library</a>
  <a class="btn" href="../sim/editor.html">Editor</a>
  <label>Theme <select data-theme-picker aria-label="Theme"></select></label>
</header>
<main id="flash"></main>
<script type="module">
  import {mount} from "./flash.js?v=__BUILD__";
  mount(document.getElementById("flash"), {name: "M-vance", manifest: "firmware/latest.json",
    releases: "https://github.com/bk40-home/M-vance/releases"});
</script>
