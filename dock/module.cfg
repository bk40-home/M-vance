# M-VANCE: M-vance (github.com/bk40-home/M-vance) as an fm1-dock module, built from this repository in place:
#   (in an fm1-dock checkout, WSL)  python3 tools/hbmod.py /mnt/c/GitHub/M-vance/dock   -> build/modules/dock.dock
# The firmware's own sources with the switches of firmware/src/mv_build.h that fit a module's 272 KiB of RAM (Kris 12 Nov,
# fm1-port/mvance-dock-feasibility-proposal-2026-11-12.md): one part, all 64 of the factory bank's programs (UPPER only;
# two banks),
# no sequencer / DEBUG page / SysEx transfer, delay lines of 900 ms. mvance.c at -Os, the engine (mv_dsp.c) at -O2, as
# the firmware's own build (tools/build.py).
name = M-VANCE
version = 1
sources = ../firmware/src/mv_dsp.c
includes = ../firmware/src ../firmware/gen ../firmware/hal
cflags = -DDINGHY_DOCK -DMV_DEBUG=0 -DMV_XFER=0 -DMV_SEQ=0 -DMV_PARTS=1 -DMV_PROGS=64u -DMV_DLY_MS=900u
cflags mvance_module.c = -Os
